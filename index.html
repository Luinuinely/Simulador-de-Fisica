<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Circuito</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./src/css/main.css">
</head>
<body class="container">
    <header>
        <h1>Simulador de Circuito Eletrodinâmico</h1>
        <h3>Por Luiza RP - 433</h3>
    </header>
    <div class="mt-4">
        <select id="forma" onchange="forma(document.getElementById('forma').value)">
            <option value="serie">Em série</option>
            <option value="par">Paralelo</option>
        </select>
        <div class="mt-4">
            <img id="cc" src="./src/img/cirquito_s1.png">
        </div>
        <div class="mt-5 col-md-4">
            <ul><h4>Configurações:</h4>
                <li class="mt-3">Carga elétrica: <input class="form-control" placeholder="Deve estar em Coulomb!" type="number" id="q"></li>
                <li class="mt-2">Tempo: <input class="form-control" type="number" placeholder="Deve estar em segundos!" id="t"></li>
                <li class="mt-2">Corrente elétrica: <input class="form-control" type="number" placeholder="Deve estar em Amperes!" id="i"></li>
                <li class="mt-2">Quantidade de cargas: <input class="form-control" type="number" id="quanq"></li>
                <li class="mt-2">Quantidade de resistências: 
                    <select id="qr" onchange="qr(document.getElementById('qr').value)">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                </li>
                <li class="mt-2">Resistência: <input class="form-control" placeholder="Deve estar em Ohms (Ω)!" type="number" id="r"></li>
                <li class="mt-2">Tensão: <input class="form-control" placeholder="Deve estar em Volts!" type="number" id="u"></li>
            </ul>
        </div>
    </div>
    <script src="./src/js/main.js"></script>
</body>
</html>
